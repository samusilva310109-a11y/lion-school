<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lion School</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/principal.css">
    <link rel="stylesheet" href="./css/tela-cursos.css">
</head>
<body>
    <header>
        <div id="logo-icon">
            <img src="./img/logo.svg" id="logo" alt="logo-lion-school">
        </div>
        

        <button class="voltar-sair">
            <img src="./img/exit-icon.svg" alt="exit-icon">
            <span>Sair</span>
        </button>
    </header>

    <main class="main-principal">
        <div class="container">

            <div class="devices-container">
                <h1>Escolha um <span>curso</span> <br>para gerenciar</h1>
                <img src="./img/devices.svg" alt="devices-image">
            </div>

            <div class="studant-container">
                <img src="./img/studant.svg" alt="">
            </div>
        
        </div>

        <div class="cursos-container">

            <button class="curso">
                <img src="./img/dev-icon.svg" alt="">
                <span>DS</span>
            </button>
            <button class="curso">
                <img src="./img/networks-icon.svg" alt="">
                <span>REDES</span>
            </button>

        </div>
    </main>

    <footer>
        <div class="contact-container">
            <ul>
                <li><img src="./img/phone-icon.svg" alt=""><span>(11) 4774-4700</span></li>
                <li><img src="./img/icon-email.svg" alt=""><span>lionschool@gmail.com</span></li>
                <li><img src="./img/locatition-icon.svg" alt=""><span>Rua tcc, 211,  Centro, Jandira</span></li>
            </ul>  
        </div>
    </footer>
</body>
</html>
