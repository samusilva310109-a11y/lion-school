<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lion School</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/principal.css">
    <link rel="stylesheet" href="./css/tela_turma.css">
    <link rel="stylesheet" href="./css/tela-info.css">
    <script type="module" src="./js/app.js" defer></script>
</head>

<body>
    <header>
        <div id="logo-icon">
            <img src="./img/logo.svg" id="logo" alt="logo-lion-school">
        </div>


        <button class="voltar-sair" id="button-header">
            <img src="./img/exit-icon.svg" alt="exit-icon">
            <span>Sair</span>
        </button>
    </header>

    <main id="main">
        <div class="info-container">

            <div class="foto-aluno-container">
                <img src="./img/profile-aluno.png" alt="">
                <span>Hélida Bento De Oliveira</span>
            </div>

            <div class="graph-container">
                <div class="div-bar">
                    <span class="number">90</span>
                    <div class="bar">
                        <div class="bar-level"></div>
                    </div>
                    <span>SOP</span>
                </div>

                <div class="div-bar">
                    <span class="number-media">100</span>
                    <div class="bar">
                        <div class="bar-level"></div>
                    </div>
                    <span>LIMA</span>
                </div>

                <div class="div-bar">
                    <span class="number number-ruim">50</span>
                    <div class="bar">
                        <div class="bar-level"></div>
                    </div>
                    <span>LOPAL</span>
                </div>

                <div class="div-bar">
                    <span class="number">30</span>
                    <div class="bar">
                        <div class="bar-level"></div>
                    </div>
                    <span>LER</span>
                </div>

                <div class="div-bar">
                    <span class="number">70</span>
                    <div class="bar">
                        <div class="bar-level"></div>
                    </div>
                    <span>ARI</span>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="contact-container">
            <ul>
                <li><img src="./img/phone-icon.svg" alt=""><span>(11) 4774-4700</span></li>
                <li><img src="./img/icon-email.svg" alt=""><span>lionschool@gmail.com</span></li>
                <li><img src="./img/locatition-icon.svg" alt=""><span>Rua tcc, 211, Centro, Jandira</span></li>
            </ul>
        </div>

        <div class="copright-container">
            <span>Copyright © 2026 | Samuel Silva</span>
        </div>

        <div class="social-media-container">
            <img src="./img/youtube-icon.svg" alt="">
            <img src="./img/twitter-icon.svg" alt="">
            <img src="./img/instagram-icon.svg" alt="">
            <img src="./img/facebook-icon.svg" alt="">
        </div>
    </footer>
</body>

</html>
